# FedVPA-GP — Stage 1: Federated Variational Preference Selector
# HH-RLHF, Qwen2-0.5B, K = 100 clients (10 sampled per round)
#
# Identical to cfg/selector_n10.yaml except for the client count and the
# per-round sampling rate. See that file for annotated hyperparameters.

use_gpu: True
device: 0

early_stop:
  patience: 0

federate:
  mode: standalone
  client_num: 100
  sample_client_num: 10
  total_round_num: 50
  save_to: "checkpoints/selector_n100.ckpt"
  save_freq: 50
  ignore_weight: True
  share_local_model: True
  online_aggr: False

data:
  root: data/
  type: 'hh-rlhf@llm'
  splitter: 'meta'
  splits: [0.8, 0.1, 0.1]

model:
  type: 'Qwen/Qwen2-0.5B@huggingface_llm'

llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]

  vpl_latent_dim: 32
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_use_difference_only: True
  vpl_deep_projection: True
  vpl_max_logvar: -4.0
  vpl_logit_dropout: 0.0

  vpl_use_gp_prior: True
  vpl_gp_temperature: 1.0
  vpl_kl_weight: 0.01

  vpl_orthogonal_weight: 1.0
  vpl_orthogonal_orthonorm_weight: 0.1
  vpl_use_manual_orthogonal_labels: False
  vpl_num_prototypes: 2
  vpl_prototype_scale: 5.0

  # Must match cfg/rl_n100.yaml.
  vpl_use_z_embedding: True
  vpl_z_source: 'hidden_state'
  vpl_z_conditioning_mode: 'add'
  vpl_adapter_dropout: 0.5

  vpl_tsne_visualize_freq: 10
  grad_accum_step: 8

dataloader:
  # batch_size 4 rather than 8: z-conditioning raises activation memory and
  # 8 goes OOM on a 48 GB card.
  batch_size: 4
  num_workers: 0
  pin_memory: True

train:
  local_update_steps: 30
  batch_or_epoch: batch
  is_enable_half: True
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.00001

criterion:
  type: CrossEntropyLoss

trainer:
  type: vplgprewardchoicetrainer
  choices: ['A', 'B']

eval:
  freq: 5
  metrics: ['loss', 'acc', 'vpl_kl_loss', 'vpl_reconstruction_loss', 'vpl_orthogonal_loss']
  best_res_update_round_wise_key: train_avg_loss
  max_samples_for_reward: 100
  count_flops: False

expname: fedvpagp_selector_n100

wandb:
  use: False
  name_user: ''
  name_project: 'fedvpagp-selector'
  online_track: True
  client_train_info: True
